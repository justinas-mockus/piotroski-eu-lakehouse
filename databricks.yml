bundle:
  name: piotroski-eu-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target (ADR-003)
  alert_email:
    description: Job failure email; set BUNDLE_VAR_alert_email, never committed

targets:
  dev:
    mode: development
    presets:
      pipelines_development: false  # dev mode's warm compute keeps a stale wheel (ADR-003)
    default: true
    variables:
      catalog: piotroski_dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: piotroski_prod

artifacts:
  piotroski_wheel:
    type: whl
    build: rm -rf dist && uv build --wheel
    path: .
