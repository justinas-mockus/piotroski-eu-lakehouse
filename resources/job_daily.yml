resources:
  jobs:
    daily:
      name: piotroski_daily
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Copenhagen
      email_notifications:
        on_failure:
          - ${var.alert_email}
      timeout_seconds: 3600
      tasks:
        - task_key: refresh
          pipeline_task:
            pipeline_id: ${resources.pipelines.fundamentals.id}
        - task_key: dq_history
          depends_on:
            - task_key: refresh
          environment_key: default
          spark_python_task:
            python_file: ../jobs/dq_history.py
            parameters: ["${var.catalog}", "{{job.run_id}}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
