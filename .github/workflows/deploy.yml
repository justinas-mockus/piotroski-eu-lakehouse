name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]  # docs-only merges don't redeploy or re-run the job
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      MASK_WORKSPACE_ID: ${{ secrets.MASK_WORKSPACE_ID }}   # never used; referencing it makes GitHub mask it in logs
      MASK_ACCOUNT_ID: ${{ secrets.MASK_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6     # the bundle artifact runs `uv build --wheel`
        with:
          python-version: "3.12"

      - uses: databricks/setup-cli@v1.21.0

      - run: databricks bundle deploy -t prod

      - name: Run the daily job
        if: vars.RUN_AFTER_DEPLOY == 'true'   # unset until the prod volume has data (ADR-003)
        shell: bash                    # adds -o pipefail: a failed run still fails the step
        run: databricks bundle run daily -t prod 2>&1 | sed -E 's/\?o=[0-9]+//'
