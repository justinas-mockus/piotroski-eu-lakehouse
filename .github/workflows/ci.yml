name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # gitleaks scans the PR's commits, not just the tip

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - uses: actions/setup-java@v5   # local PySpark in the unit tests needs a JVM
        with:
          distribution: temurin
          java-version: "17"

      - run: uv sync --locked

      - name: Lint and format
        run: SKIP=gitleaks uv run pre-commit run --all-files --show-diff-on-failure

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: uv run pytest

      - uses: databricks/setup-cli@v1.21.0

      - name: Bundle validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t prod
