[project]
name = "piotroski-eu-lakehouse"
version = "0.1.0"
description = "Piotroski F-scores from EU ESEF filings on Databricks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pyspark",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
